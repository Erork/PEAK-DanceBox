[config]
schemaVersion = "0.0.1"

[package]
namespace = "dline"
name = "DanceBox"
versionNumber = "2.0.8"
description = "Switch dance models, play music-first random dances, and add Humanoid model bundles, AnimationClip bundles, or OGG/WAV/MP3 music."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack_PEAK" = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "dist/thunderstore"

[[build.copy]]
source = "dist/DanceBox/plugins"
target = "plugins"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "licenses"
target = "licenses"
